<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ATC · Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="admin-body">

<!-- ──────── LOGIN ──────── -->
<section id="login" class="admin-login">
  <div class="login-box">
    <div class="login-head">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="login-title">atc@terminal:~</span>
    </div>
    <form id="loginForm" autocomplete="off">
      <p class="login-line"><span class="prompt">$</span> connect dashboard<span class="cursor">_</span></p>
      <label class="login-label" for="pw">ACCESS CODE</label>
      <input id="pw" type="password" placeholder="•••••••" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      <button type="submit">CONNECT ▸</button>
      <p id="loginErr" class="login-err hidden"></p>
    </form>
  </div>
</section>

<!-- ──────── DASHBOARD ──────── -->
<div id="dashboard" class="admin-dashboard hidden">

  <header class="terminal-ticker">
    <span class="ticker-brand">◆ ATC TERMINAL</span>
    <span class="ticker-live"><span class="live-dot"></span>LIVE</span>
    <span class="ticker-time" id="tickerTime">--:--:--</span>
    <span class="ticker-spacer"></span>
    <span class="ticker-msg" id="tickerMsg">SYNCED</span>
    <button type="button" class="ticker-btn" id="refreshBtn">↻ REFRESH</button>
    <button type="button" class="ticker-btn" id="logoutBtn">✕ EXIT</button>
  </header>

  <section class="kpi-strip" id="kpiStrip" aria-label="Key numbers"></section>

  <section class="chart-grid">

    <div class="panel">
      <div class="panel-head">
        <h3>TRADER TYPES</h3>
        <span class="panel-tag" id="tagTrader">—</span>
      </div>
      <div class="chart-wrap" id="chartTrader"></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h3>FINANCE × TECH</h3>
        <span class="panel-tag">TRADER GAME</span>
      </div>
      <div class="chart-wrap" id="chartBalance"></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h3>KNOWLEDGE LEVELS</h3>
        <span class="panel-tag">QUIZ</span>
      </div>
      <div class="chart-wrap" id="chartLevels"></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h3>BY FIELD</h3>
        <span class="panel-tag">QUIZ</span>
      </div>
      <div class="chart-wrap" id="chartFields"></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h3>EDUCATION</h3>
        <span class="panel-tag">SIGNUPS</span>
      </div>
      <div class="chart-wrap" id="chartEducation"></div>
    </div>

  </section>

  <section class="table-grid">
    
    <div class="panel panel-wide">
      <div class="panel-head">
        <h3>SIGNUPS · LAST 24H</h3>
        <span class="panel-tag" id="tagSignups">—</span>
      </div>
      <div class="chart-wrap" id="chartSignups"></div>
    </div>
    
  </section>

  <section class="table-grid">

    <div class="panel">
      <div class="panel-head">
        <h3>SIGNUPS · LATEST</h3>
        <span class="panel-tag" id="tagSignupsTable">—</span>
      </div>
      <div class="table-scroll">
        <table id="tableSignups" class="terminal-table"></table>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h3>RESULTS · LATEST</h3>
        <span class="panel-tag" id="tagResultsTable">—</span>
      </div>
      <div class="table-scroll">
        <table id="tableResults" class="terminal-table"></table>
      </div>
    </div>

  </section>

</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
